target-version = "py311"
line-length = 120

# Initial conservative rule families: E4, E7, E9, F
lint.select = ["E4", "E7", "E9", "F"]

# Pragmatic initial ignores to avoid giant formatting churn
lint.ignore = [
    "E401",  # Multiple imports on one line in legacy scripts
    "E402",  # Module level import not at top of file (needed for sys.path bootstrapping)
    "E701",  # Multiple statements on one line (colon) in compact test helpers
    "E702",  # Multiple statements on one line (semicolon) in compact test helpers
    "E711",  # Comparison to None should be 'if cond is None:' (breaks SQLAlchemy column == None)
    "E712",  # Comparison to True should be 'if cond is True:' (breaks SQLAlchemy column == True)
    "E722",  # Do not use bare 'except' in historical scripts
    "E731",  # Do not assign a lambda expression, use a def in offline evaluation script
    "E741",  # Ambiguous variable name
    "F401",  # Module imported but unused (deferred to future incremental cleanup)
    "F601",  # Dictionary key literal repeated in historical dictionary generation script
    "F841",  # Local variable name is assigned to but never used
    "F541",  # f-string without placeholders
]

exclude = [
    ".git",
    ".venv",
    "venv",
    "env",
    "__pycache__",
    "scratch",
    ".agents",
    ".claude",
    ".gemini",
    "models",
    "evaluation/results",
    "evaluation/cache",
]
