<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" role="img" aria-label="Minh họa bánh mì nguyên cám">
<title>Bánh mì nguyên cám</title>
<rect width="640" height="440" fill="#f6f3ee"/>
<path d="M0 350C128 306 212 368 348 337S533 300 640 332V440H0Z" fill="#e8eeea" opacity=".55"/>
<!-- Shadow under cutting board -->
<ellipse cx="320" cy="342" rx="210" ry="26" fill="#35585b" opacity=".08"/>
<!-- Wooden cutting board -->
<rect x="130" y="270" width="380" height="45" rx="12" fill="#d2b48c" stroke="#8c6d46" stroke-width="2.5"/>
<rect x="135" y="274" width="370" height="10" rx="4" fill="#deb887" opacity=".6"/>
<!-- Handle on right -->
<rect x="500" y="284" width="40" height="16" rx="6" fill="#c4a478" stroke="#8c6d46" stroke-width="2.5"/>
<circle cx="528" cy="292" r="4" fill="#f6f3ee"/>
<!-- Bread Loaf Body -->
<path d="M210 270 C190 200 240 160 330 160 C420 160 455 200 445 270 Z" fill="#7a4b2a" stroke="#4a2e18" stroke-width="3"/>
<path d="M225 265 C210 205 250 175 330 175 C400 175 435 205 430 265 Z" fill="#935b32"/>
<!-- Bread crust cuts / scoring -->
<path d="M255 195 Q275 220 280 250" fill="none" stroke="#e0c29e" stroke-width="7" stroke-linecap="round"/>
<path d="M315 180 Q335 210 335 248" fill="none" stroke="#e0c29e" stroke-width="7" stroke-linecap="round"/>
<path d="M375 188 Q395 218 390 250" fill="none" stroke="#e0c29e" stroke-width="7" stroke-linecap="round"/>
<!-- Whole grain seeds on crust -->
<g fill="#f5deb3" stroke="#b8860b" stroke-width="1">
  <ellipse cx="295" cy="180" rx="4" ry="2" transform="rotate(25 295 180)"/>
  <ellipse cx="350" cy="185" rx="4" ry="2" transform="rotate(-30 350 185)"/>
  <ellipse cx="270" cy="225" rx="4" ry="2" transform="rotate(15 270 225)"/>
  <ellipse cx="355" cy="220" rx="4" ry="2" transform="rotate(-20 355 220)"/>
  <ellipse cx="405" cy="215" rx="3.5" ry="2" transform="rotate(45 405 215)"/>
</g>
<!-- Bread Slice leaning on left -->
<g transform="translate(180 230) rotate(-18)">
  <path d="M-40 35 C-50 -10 -25 -40 10 -40 C45 -40 60 -10 50 35 Z" fill="#6e4224" stroke="#4a2e18" stroke-width="2.5"/>
  <path d="M-33 32 C-40 -6 -20 -33 10 -33 C38 -33 50 -6 43 32 Z" fill="#ecd5b9"/>
  <!-- Grain flecks inside slice -->
  <g fill="#8b5a2b" opacity=".7">
    <circle cx="-10" cy="-10" r="1.5"/><circle cx="5" cy="-15" r="1.8"/><circle cx="20" cy="-5" r="1.4"/>
    <circle cx="-15" cy="10" r="1.6"/><circle cx="8" cy="12" r="1.5"/><circle cx="25" cy="15" r="1.7"/>
    <circle cx="-5" cy="20" r="1.4"/><circle cx="15" cy="-2" r="1.5"/>
  </g>
</g>
<!-- Wheat Stalk Decors on right -->
<g stroke="#a5814e" stroke-width="2" stroke-linecap="round" fill="#dfbe84" transform="translate(470 320) rotate(45)">
  <path d="M0 0 L-60 -90" fill="none" stroke-width="2.5"/>
  <ellipse cx="-20" cy="-30" rx="9" ry="4" transform="rotate(-30 -20 -30)"/>
  <ellipse cx="-25" cy="-45" rx="9" ry="4" transform="rotate(30 -25 -45)"/>
  <ellipse cx="-35" cy="-55" rx="8" ry="4" transform="rotate(-30 -35 -55)"/>
  <ellipse cx="-40" cy="-70" rx="8" ry="3.5" transform="rotate(30 -40 -70)"/>
  <ellipse cx="-52" cy="-80" rx="7" ry="3" transform="rotate(-25 -52 -80)"/>
</g>
</svg>
