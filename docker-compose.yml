version: '3.8'

services:
  # 1. Cơ sở dữ liệu sản xuất PostgreSQL 16
  postgres:
    image: postgres:16-alpine
    container_name: medimind_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-medimind_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-MedimindSecure2026!}
      POSTGRES_DB: ${POSTGRES_DB:-medimind_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medimind_admin -d medimind_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. Bộ nhớ đệm & hàng đợi Redis 7
  redis:
    image: redis:7-alpine
    container_name: medimind_redis
    restart: always
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-MedimindRedis2026!}
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-MedimindRedis2026!}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 3. Ứng dụng Backend Web (Flask / Python)
  web:
    build: .
    container_name: medimind_app
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - DATABASE_URL=${DATABASE_URL:-sqlite:///instance/medimind.db}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-MedimindRedis2026!}@redis:6379/0
      - SECRET_KEY=${SECRET_KEY:-medimind-clinical-session-secret-2026}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - SMTP_SERVER=${SMTP_SERVER}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USERNAME=${SMTP_USERNAME}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
    volumes:
      - uploads_data:/app/uploads
      - ./instance:/app/instance
    expose:
      - "8000"

  # 4. Tầng Biên mạng & Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: medimind_nginx
    restart: always
    depends_on:
      - web
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./static:/app/static:ro
      - nginx_logs:/var/log/nginx

volumes:
  postgres_data:
  redis_data:
  uploads_data:
  nginx_logs:
