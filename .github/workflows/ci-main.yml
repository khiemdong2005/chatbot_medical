name: Main Branch Quality Gate

"on":
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-main-${{ github.ref }}
  cancel-in-progress: true

env:
  SECRET_KEY: "ci-testing-only-not-a-production-secret-32chars"
  GEMINI_API_KEY: ""
  GOOGLE_API_KEY: ""
  GEMINI_NUTRITION_API_KEY: ""
  TWILIO_ACCOUNT_SID: ""
  SPEEDSMS_API_KEY: ""
  RAG_QUERY_EXPANSION_ENABLED: "false"
  RAG_VECTOR_SEARCH_ENABLED: "false"
  RAG_RERANK_ENABLED: "false"
  PYTHONUNBUFFERED: "1"

jobs:
  quality:
    name: Quality & Test Gate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Validate system configuration
        run: |
          python scripts/check_config.py

      - name: Run Ruff linter
        run: |
          python -m ruff check .

      - name: Run test suite with coverage (Zero Secrets / Offline)
        run: |
          python -m pytest -q -m "not live" --cov=core --cov-report=term-missing --cov-report=xml

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage.xml
          if-no-files-found: ignore

      - name: Prepare template environment for Docker Compose
        run: |
          cp .env.example .env

      - name: Validate Docker Compose configuration
        run: |
          docker compose config

      - name: Run Docker packaging & configuration tests
        run: |
          python -m pytest scripts/test_docker_local.py -q

  docker-smoke:
    name: Docker Build & Container Smoke Gate
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare template environment
        run: |
          cp .env.example .env

      - name: Build Docker image
        run: |
          docker build -t medimind-api:${{ github.sha }} .

      - name: Inspect Docker image
        run: |
          docker images medimind-api:${{ github.sha }}

      - name: Start application container
        run: |
          docker run -d \
            --name medimind-ci \
            -p 8000:8000 \
            --env-file .env \
            medimind-api:${{ github.sha }}

      - name: Verify non-root user execution
        run: |
          USER_ID=$(docker exec medimind-ci id -u)
          GROUP_ID=$(docker exec medimind-ci id -g)
          echo "Container running as UID=$USER_ID, GID=$GROUP_ID"
          if [ "$USER_ID" != "1000" ]; then
            echo "Security check failed: container must run as non-root appuser (UID 1000)"
            exit 1
          fi

      - name: Poll /health until ready
        run: |
          echo "Polling /health (max 30 attempts, 2s interval)..."
          for i in $(seq 1 30); do
            if curl -s -f http://localhost:8000/health > /dev/null 2>&1; then
              echo "Container healthy at attempt $i."
              exit 0
            fi
            echo "Attempt $i: waiting for container to start..."
            sleep 2
          done
          echo "ERROR: Container failed to become healthy within 60s"
          exit 1

      - name: Check /ready endpoint
        run: |
          echo "Probing /ready status..."
          READY_RESP=$(curl -s http://localhost:8000/ready || true)
          echo "Ready response payload: $READY_RESP"
          echo "$READY_RESP" | grep -q "circuit_breaker" || {
            echo "Ready endpoint check failed: missing circuit_breaker state in payload"
            exit 1
          }

      - name: Smoke test non-emergency chat endpoint
        run: |
          echo "Sending non-emergency medical inquiry..."
          CHAT_RESP=$(curl -s -f -X POST http://localhost:8000/api/chat \
            -H "Content-Type: application/json" \
            -d '{"message": "Tăng huyết áp là gì?", "history": [], "lang": "vi"}')
          echo "Chat response payload: $CHAT_RESP"
          echo "$CHAT_RESP" | grep -q '"answer"' || {
            echo "Chat smoke failed: missing 'answer' field in response"
            exit 1
          }

      - name: Smoke test emergency chat endpoint
        run: |
          echo "Sending emergency clinical inquiry..."
          EMERGENCY_RESP=$(curl -s -f -X POST http://localhost:8000/api/chat \
            -H "Content-Type: application/json" \
            -d '{"message": "Tôi đang bị đau ngực dữ dội khó thở", "history": [], "lang": "vi"}')
          echo "Emergency response payload: $EMERGENCY_RESP"
          echo "$EMERGENCY_RESP" | grep -E -q '"is_emergency":\s*true' || {
            echo "Emergency smoke failed: is_emergency was not true"
            exit 1
          }

      - name: Print container logs on failure
        if: failure()
        run: |
          echo "=== Docker Container Logs (Failure Diagnosis) ==="
          docker logs medimind-ci

      - name: Cleanup container
        if: always()
        run: |
          docker rm -f medimind-ci 2>/dev/null || true
