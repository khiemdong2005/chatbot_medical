name: Release AI Quality & Clinical Safety Gate

"on":
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: quality-release-${{ github.ref }}
  cancel-in-progress: true

env:
  SECRET_KEY: "ci-testing-only-not-a-production-secret-32chars"
  GEMINI_API_KEY: ""
  GOOGLE_API_KEY: ""
  GEMINI_NUTRITION_API_KEY: ""
  TWILIO_ACCOUNT_SID: ""
  SPEEDSMS_API_KEY: ""
  RAG_QUERY_EXPANSION_ENABLED: "false"
  RAG_VECTOR_SEARCH_ENABLED: "false"
  RAG_RERANK_ENABLED: "false"
  PYTHONUNBUFFERED: "1"

jobs:
  integrity:
    name: Integrity & Manifest Gate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements/tools.txt
            requirements/dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements/dev.txt

      - name: Validate system configuration
        run: |
          python scripts/check_config.py

      - name: Verify dataset manifest and canonical corpus integrity
        run: |
          python -m pytest tests/test_ci_foundations.py -q

      - name: Verify release quality gates configuration
        run: |
          python -m pytest tests/test_quality_gates.py -q

  retrieval-quality:
    name: RAG Retrieval Quality Gate (HOLDOUT)
    needs: integrity
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements/tools.txt
            requirements/dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements/dev.txt

      - name: Run frozen HOLDOUT retrieval benchmark & check quality gates
        run: |
          mkdir -p artifacts
          python scripts/check_quality_gates.py \
            --run-retrieval \
            --output-retrieval artifacts/retrieval_quality.json

      - name: Upload retrieval quality artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: retrieval-quality-report
          path: artifacts/retrieval_quality.json
          if-no-files-found: ignore

      - name: Verify repository read-only immutability
        run: |
          git diff --exit-code -- data/curated/ready_documents evaluation

  clinical-safety:
    name: Clinical Safety & Guardrails Gate
    needs: integrity
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements/tools.txt
            requirements/dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements/dev.txt

      - name: Run frozen clinical safety benchmark & check guardrails gates
        run: |
          mkdir -p artifacts
          python scripts/check_quality_gates.py \
            --run-safety \
            --output-safety artifacts/safety_quality.json

      - name: Upload clinical safety artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: clinical-safety-report
          path: artifacts/safety_quality.json
          if-no-files-found: ignore

      - name: Verify repository read-only immutability
        run: |
          git diff --exit-code -- data/curated/ready_documents evaluation
