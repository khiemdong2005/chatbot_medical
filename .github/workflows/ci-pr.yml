name: CI Pull Request Quality Gate

"on":
  pull_request:
    branches:
      - main
      - khim
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-pr-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SECRET_KEY: "ci-testing-only-not-a-production-secret-32chars"
  GEMINI_API_KEY: ""
  GOOGLE_API_KEY: ""
  GEMINI_NUTRITION_API_KEY: ""
  TWILIO_ACCOUNT_SID: ""
  SPEEDSMS_API_KEY: ""
  RAG_QUERY_EXPANSION_ENABLED: "false"
  RAG_VECTOR_SEARCH_ENABLED: "false"
  RAG_RERANK_ENABLED: "false"
  PYTHONUNBUFFERED: "1"

jobs:
  pr-quality-gate:
    name: PR Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements/tools.txt
            requirements/dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements/dev.txt

      - name: Validate system configuration
        run: |
          python scripts/check_config.py

      - name: Run Ruff linter
        run: |
          python -m ruff check .

      - name: Run test suite (Zero Secrets / Offline)
        run: |
          python -m pytest -q -m "not live"

      - name: Prepare template environment for Docker
        run: |
          cp .env.example .env

      - name: Validate Docker Compose configuration
        run: |
          docker compose config

      - name: Run Docker packaging & runtime parity tests
        run: |
          python -m pytest scripts/test_docker_local.py -q
