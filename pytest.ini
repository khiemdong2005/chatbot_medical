[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test* *Tests
python_functions = test_*
addopts = -ra
markers =
    unit: Fast unit tests with no heavy I/O
    integration: Integration tests for gateway, database, and API routing
    safety: Clinical safety guardrails and triage tests
    rag: RAG retrieval, chunking, and ingestion tests
    ui: Frontend UI correctness and accessibility tests
    slow: Long-running or concurrency stress tests
    live: Tests requiring live external network providers (opt-in only)
    docker: Docker and container packaging tests
    evaluation: Retrieval and answer quality benchmarks
