      <rect x="939" y="289" width="196" height="116" rx="17" fill="#fff" stroke="#cbd8e7" filter="url(#shadow)"/>
      <text x="958" y="322" font-size="17" font-weight="800" fill="#14243b">Lightsail snapshots</text>
      <text x="958" y="347" font-size="13" fill="#5c6d80">Sao lưu 7 bản gần nhất</text>
      <text x="958" y="369" font-size="13" fill="#5c6d80">Kiểm tra khôi phục định kỳ</text>
      <text x="958" y="391" font-size="12" fill="#155eef" font-weight="700">Theo GB đã lưu</text>
      <path d="M836 458H892V347H939" fill="none" stroke="#5c7da3" stroke-width="3" stroke-dasharray="7 6" marker-end="url(#arrow)"/>

      <rect x="939" y="445" width="196" height="82" rx="17" fill="#fff" stroke="#cbd8e7" filter="url(#shadow)"/>
      <text x="958" y="477" font-size="17" font-weight="800" fill="#14243b">AWS Budgets</text>
      <text x="958" y="502" font-size="13" fill="#5c6d80">Cảnh báo chi phí / credit</text>

      <text x="43" y="594" font-size="13" font-weight="700" fill="#855d24">Giới hạn:</text>
      <text x="112" y="594" font-size="13" fill="#6b7690">Một máy / một AZ; hỏng máy có thể gián đoạn. Không đặt SQLite, Chroma hay uploads ra Internet.</text>
      <text x="43" y="669" font-size="12" fill="#6c7c90">Thiết kế dựa trên Dockerfile, docker-compose.yml và cấu hình lưu trữ hiện tại của repository · 14/11/2026</text>
