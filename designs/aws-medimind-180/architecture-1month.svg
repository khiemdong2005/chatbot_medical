<rect x="46" y="649" width="1144" height="58" rx="12" fill="#fff6e8" stroke="#efd8ad"/>
<text x="67" y="675" font-size="14" font-weight="800" fill="#825519">Bắt buộc trước khi triển khai:</text>
<text x="67" y="695" font-size="12" fill="#755d3f">SQLite → PostgreSQL · uploads → bucket · trạng thái phiên/rate limit dùng chung · Chroma index đóng băng, phát hành đồng bộ · test 100 request đồng thời</text>
<text x="46" y="765" font-size="12" fill="#6b7b8d">Thiết kế mục tiêu, chưa phải mô tả hạ tầng đã triển khai. Giá AWS theo bảng Lightsail tại ngày 14/11/2026.</text>
