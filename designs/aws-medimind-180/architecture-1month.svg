<svg class="diagram" viewBox="0 0 1230 780" role="img" aria-labelledby="title desc" xmlns="http://www.w3.org/2000/svg">
<title id="title">MediMind trên Lightsail hai vùng sẵn sàng</title><desc id="desc">Người dùng đi qua HTTPS tới Lightsail load balancer, phân phối tới hai máy FastAPI tại hai Availability Zone. Hai máy dùng PostgreSQL high availability và Lightsail object storage. Google Gemini là dịch vụ ngoài AWS.</desc>
