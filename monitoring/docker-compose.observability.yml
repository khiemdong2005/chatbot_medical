# ==============================================================
# DOCKER COMPOSE: PROMETHEUS + GRAFANA + NODE EXPORTER (UBUNTU VM)
# Chạy lệnh: docker compose -f monitoring/docker-compose.observability.yml up -d
# ==============================================================

services:
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: medimind-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=15d"
      - "--web.enable-lifecycle"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:11.2.0
    container_name: medimind-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=Nitax
      - GF_USERS_ALLOW_SIGN_UP=false
    depends_on:
      - prometheus
